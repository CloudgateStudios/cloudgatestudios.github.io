<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Race Replay icon">
  <title>Race Replay</title>
  <defs>
    <linearGradient id="rrTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- Tile. Left square; the site's CSS applies the squircle radius. -->
  <rect width="512" height="512" fill="url(#rrTile)"/>

  <!-- Mark taken from the racereplay.app header logo (viewBox 0 0 28 28),
       centred on the tile and scaled to fill ~64% of its width. -->
  <g transform="translate(256 256) scale(13.6) translate(-14 -14)">
    <polygon points="26,14 20,24 8,24 2,14 8,4 20,4" fill="#f97316"/>
    <polygon points="11,9 11,19 20,14" fill="#ffffff"/>
  </g>
</svg>
